<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客导入 - SimpleCompression</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 24px; }
        h1 { font-size: 24px; margin-bottom: 8px; color: #60a5fa; }
        .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #334155; }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: #cbd5e1; }
        textarea { width: 100%; min-height: 200px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 12px; color: #e2e8f0; font-family: 'Consolas', monospace; font-size: 13px; resize: vertical; }
        textarea:focus { outline: none; border-color: #3b82f6; }
        .btn-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #475569; color: white; }
        .btn-secondary:hover { background: #64748b; }
        .msg { padding: 10px 16px; border-radius: 8px; margin-top: 12px; font-size: 14px; display: none; }
        .msg.success { display: block; background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
        .msg.error { display: block; background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
        .article-list { margin-top: 12px; }
        .article-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #0f172a; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
        .article-item .title { flex: 1; color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .article-item .meta { color: #64748b; margin-left: 12px; white-space: nowrap; }
        .article-item .del-btn { background: none; border: none; color: #ef4444; cursor: pointer; margin-left: 8px; font-size: 16px; }
        .article-item .del-btn:hover { color: #fca5a5; }
        .login-overlay { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #334155; width: 100%; max-width: 360px; text-align: center; }
        .login-box h2 { margin-bottom: 8px; color: #60a5fa; }
        .login-box p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .login-box input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #e2e8f0; font-size: 16px; margin-bottom: 16px; }
        .login-box input:focus { outline: none; border-color: #3b82f6; }
        .login-box .error { color: #ef4444; font-size: 13px; margin-top: -8px; margin-bottom: 12px; display: none; }
        .stats { display: flex; gap: 16px; margin-bottom: 16px; }
        .stat { background: #0f172a; padding: 12px 20px; border-radius: 8px; text-align: center; }
        .stat .num { font-size: 28px; font-weight: 700; color: #60a5fa; }
        .stat .label { font-size: 12px; color: #64748b; }
        .format-hint { font-size: 12px; color: #64748b; margin-top: 8px; }
        code { background: #334155; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🔒 管理员登录</h2>
            <p>请输入密码进入博客导入页面</p>
            <input type="password" id="pwdInput" placeholder="密码" onkeydown="if(event.key==='Enter')checkPwd()">
            <div class="error" id="pwdError">密码错误</div>
            <button class="btn-primary" style="width:100%" onclick="checkPwd()">进入</button>
        </div>
    </div>
    <h1>📝 博客一键导入</h1>
    <p class="subtitle">导入文章到 SimpleCompression 博客系统（存储在浏览器 localStorage）</p>

    <div class="stats" id="stats"></div>

    <div class="card">
        <h2>📦 导入文章</h2>
        <p class="format-hint">支持格式：JSON 数组 <code>[{id, title, excerpt, content, tags, category, status, createdAt}]</code> 或含 <code>posts</code> 字段的对象</p>
        <p class="format-hint">标题/摘要/内容/标签支持双语对象 <code>{"zh":"...", "en":"..."}</code> 或纯字符串</p>
        <textarea id="importData" placeholder='粘贴 JSON 数据，例如：
[
  {
    "id": "21",
    "title": "新文章标题",
    "excerpt": "摘要",
    "content": "正文内容",
    "tags": ["tag1"],
    "category": "seo",
    "status": "published",
    "createdAt": "2026-05-14T12:00:00+08:00"
  }
]'></textarea>
        <div class="btn-row">
            <button class="btn-primary" onclick="importArticles()">📥 一键导入</button>
            <button class="btn-primary" onclick="importFromBlogsJson()">📦 从 blogs.json 导入</button>
            <button class="btn-secondary" onclick="loadSample()">📋 加载示例</button>
            <button class="btn-danger" onclick="clearAll()">🗑️ 清空全部</button>
            <button class="btn-secondary" onclick="exportData()">📤 导出</button>
        </div>
        <div class="msg" id="msg"></div>
    </div>

    <div class="card">
        <h2>📚 当前文章列表</h2>
        <div class="article-list" id="articleList"></div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        const ADMIN_PWD = 'yasuo2026'; // 修改这里更改密码

        function checkPwd() {
            const input = document.getElementById('pwdInput').value;
            if (input === ADMIN_PWD) {
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                document.getElementById('pwdError').style.display = 'block';
                document.getElementById('pwdInput').value = '';
            }
        }

        function showMsg(text, type) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg ' + type;
            setTimeout(() => { el.style.display = 'none'; el.className = 'msg'; }, 4000);
        }

        function refreshList() {
            const data = Storage.getData();
            const posts = data.posts || [];
            const container = document.getElementById('articleList');
            const stats = document.getElementById('stats');

            const published = posts.filter(p => p.status === 'published').length;
            const draft = posts.filter(p => p.status !== 'published').length;
            stats.innerHTML = `
                <div class="stat"><div class="num">${posts.length}</div><div class="label">总计</div></div>
                <div class="stat"><div class="num">${published}</div><div class="label">已发布</div></div>
                <div class="stat"><div class="num">${draft}</div><div class="label">草稿</div></div>
            `;

            if (posts.length === 0) {
                container.innerHTML = '<p style="color:#64748b;text-align:center;padding:20px;">暂无文章</p>';
                return;
            }

            container.innerHTML = posts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).map(p => {
                const title = typeof p.title === 'object' ? (p.title.zh || p.title.en) : p.title;
                const date = new Date(p.createdAt).toLocaleDateString('zh-CN');
                return `<div class="article-item">
                    <span class="title">${title}</span>
                    <span class="meta">${date} · ${p.category || '未分类'} · ${p.status}</span>
                    <button class="del-btn" onclick="deleteArticle('${p.id}')" title="删除">✕</button>
                </div>`;
            }).join('');
        }

        function parseArticles(raw) {
            let data;
            try {
                data = JSON.parse(raw);
            } catch (e) {
                throw new Error('JSON 解析失败：' + e.message);
            }
            // Support {posts: [...]} or [...]
            let posts = Array.isArray(data) ? data : (data.posts || []);
            if (!Array.isArray(posts)) {
                throw new Error('数据格式错误：需要数组或含 posts 字段的对象');
            }
            // Validate & normalize
            return posts.map((p, i) => {
                if (!p.title) throw new Error(`第 ${i + 1} 篇缺少 title`);
                return {
                    id: String(p.id || Date.now() + i),
                    title: p.title,
                    excerpt: p.excerpt || '',
                    content: p.content || '',
                    tags: p.tags || [],
                    category: p.category || 'seo',
                    status: p.status || 'published',
                    createdAt: p.createdAt || new Date().toISOString()
                };
            });
        }

        function importArticles() {
            const raw = document.getElementById('importData').value.trim();
            if (!raw) { showMsg('请先粘贴 JSON 数据', 'error'); return; }

            try {
                const newPosts = parseArticles(raw);
                const data = Storage.getData();
                const existingIds = new Set((data.posts || []).map(p => String(p.id)));

                let added = 0, updated = 0;
                for (const p of newPosts) {
                    if (existingIds.has(String(p.id))) {
                        const idx = data.posts.findIndex(x => String(x.id) === String(p.id));
                        data.posts[idx] = p;
                        updated++;
                    } else {
                        data.posts.push(p);
                        added++;
                    }
                }
                Storage.saveData(data);
                refreshList();
                showMsg(`✅ 导入完成：新增 ${added} 篇，更新 ${updated} 篇`, 'success');
            } catch (e) {
                showMsg('❌ ' + e.message, 'error');
            }
        }

        function deleteArticle(id) {
            const data = Storage.getData();
            data.posts = data.posts.filter(p => String(p.id) !== String(id));
            Storage.saveData(data);
            refreshList();
        }

        function clearAll() {
            if (!confirm('确定清空所有文章？')) return;
            const data = Storage.getData();
            data.posts = [];
            Storage.saveData(data);
            refreshList();
            showMsg('已清空所有文章', 'success');
        }

        function exportData() {
            const data = Storage.getData();
            const json = JSON.stringify({ posts: data.posts }, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'blog-export.json'; a.click();
            URL.revokeObjectURL(url);
        }

        async function importFromBlogsJson() {
            try {
                const resp = await fetch('blogs.json');
                if (!resp.ok) throw new Error('blogs.json 加载失败');
                const data = await resp.json();
                const posts = data.posts || [];
                if (posts.length === 0) { showMsg('blogs.json 中没有文章', 'error'); return; }
                // Convert bilingual to flat strings based on current lang
                const lang = localStorage.getItem('language') || 'en';
                const flat = posts.map((p, i) => ({
                    id: String(p.id || Date.now() + i),
                    title: typeof p.title === 'object' ? (p.title[lang] || p.title.en || '') : p.title,
                    excerpt: typeof p.excerpt === 'object' ? (p.excerpt[lang] || p.excerpt.en || '') : p.excerpt,
                    content: typeof p.content === 'object' ? (p.content[lang] || p.content.en || '') : p.content,
                    tags: typeof p.tags === 'object' ? (p.tags[lang] || p.tags.en || []) : p.tags,
                    category: p.category || 'seo',
                    status: p.status || 'published',
                    createdAt: p.createdAt || new Date().toISOString()
                }));
                document.getElementById('importData').value = JSON.stringify(flat, null, 2);
                showMsg(`✅ 已加载 ${flat.length} 篇文章，点击「一键导入」写入`, 'success');
            } catch (e) {
                showMsg('❌ ' + e.message, 'error');
            }
        }

        function loadSample() {
            const sample = [{
                id: String(Date.now()),
                title: { zh: "示例文章标题", en: "Sample Article Title" },
                excerpt: { zh: "这是一篇示例文章", en: "This is a sample article" },
                content: { zh: "这里是文章正文内容...", en: "Article content goes here..." },
                tags: { zh: ["图片压缩"], en: ["image compression"] },
                category: "seo",
                status: "published",
                createdAt: new Date().toISOString()
            }];
            document.getElementById('importData').value = JSON.stringify(sample, null, 2);
        }

        refreshList();
    </script>
</body>
</html>
