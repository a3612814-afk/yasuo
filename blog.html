<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Image Compressor</title>
    <meta name="description" content="Learn about image compression, website optimization, and web development.">
    <meta name="keywords" content="image compression, blog, web development, website optimization">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e5e5e5;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
        }

        .lang-switcher {
            display: flex;
            gap: 4px;
            background: var(--bg-primary);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .lang-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            color: var(--text-primary);
        }

        .lang-btn.active {
            background: var(--accent);
            color: white;
        }

        main {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 64px 24px;
            width: 100%;
        }

        .page-header {
            margin-bottom: 48px;
        }

        .page-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
        }

        .articles {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        article {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        article:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 12px 24px rgba(0,0,0,0.08);
        }

        .article-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        article h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        article h2 a {
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            display: block;
        }

        article h2 a:hover {
            color: var(--accent);
        }

        article p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .article-tags {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .tag {
            font-size: 12px;
            padding: 4px 10px;
            background: #f0f4ff;
            color: var(--accent);
            border-radius: 4px;
            text-decoration: none;
        }

        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 48px 24px;
            margin-top: auto;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .friend-links {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .friend-links a {
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .friend-links a:hover {
            color: var(--accent);
        }

        .copyright {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .nav-inner {
                flex-direction: column;
                height: auto;
                padding: 12px 24px;
                gap: 12px;
            }

            .nav-left {
                width: 100%;
                justify-content: space-between;
            }

            .nav-links {
                gap: 20px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            article {
                padding: 24px;
            }
        }
    </style>
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <div class="nav-left">
                <a href="index.html" class="logo">Image<span>Compressor</span></a>
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="nav.home">Home</a></li>
                    <li><a href="blog.html" class="active" data-i18n="nav.blog">Blog</a></li>
                    <li><a href="help.html" data-i18n="nav.help">Help</a></li>
                </ul>
            </div>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="zh">中文</button>
            </div>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h1 data-i18n="blog.title">Blog</h1>
            <p data-i18n="blog.subtitle">Share knowledge about image compression, website optimization, and frontend development</p>
        </div>

        <div class="articles" id="articlesContainer">
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <div class="footer-title" data-i18n="footer.friendLinks">Friend Links</div>
            <div class="friend-links" id="friendLinksContainer">
            </div>
            <div class="copyright" data-i18n="footer.copyright">© 2024 Image Compressor. Free online image compressor.</div>
        </div>
    </footer>

    <script>
        const langBtns = document.querySelectorAll('.lang-btn');

        function initLanguage() {
            const savedLang = localStorage.getItem('language') || 'en';
            setLanguage(savedLang);
            updateLangButtons(savedLang);
            translatePage();
        }

        function setLanguage(lang) {
            localStorage.setItem('language', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            
            const logo = document.querySelector('.logo');
            if (lang === 'zh') {
                logo.innerHTML = '图<span>压缩</span>';
                document.title = '博客 - 图压缩';
            } else {
                logo.innerHTML = 'Image<span>Compressor</span>';
                document.title = 'Blog - Image Compressor';
            }
            
            updateLangButtons(lang);
            translatePage();
        }

        function updateLangButtons(lang) {
            langBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setLanguage(btn.dataset.lang);
            });
        });

        function showArticleDetail(post) {
            const lang = getLanguage();
            const message = lang === 'zh' 
                ? `📄 ${post.title}\n\n${post.excerpt}\n\n📅 ${Utils.formatDate(post.createdAt)}\n\n🏷️ ${post.tags.join(', ')}\n\n\n文章详情功能开发中...`
                : `📄 ${post.title}\n\n${post.excerpt}\n\n📅 ${Utils.formatDate(post.createdAt)}\n\n🏷️ ${post.tags.join(', ')}\n\n\nArticle details coming soon...`;
            alert(message);
        }

        async function loadArticles() {
            const container = document.getElementById('articlesContainer');
            const posts = await Storage.getPosts().filter(p => p.status === 'published').sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            if (posts.length === 0) {
                container.innerHTML = `
                    <article>
                        <p style="color: var(--text-muted); text-align: center; padding: 48px;">${getLanguage() === 'zh' ? '暂无文章' : 'No articles yet'}</p>
                    </article>
                `;
                return;
            }

            container.innerHTML = posts.map(post => `
                <article style="cursor: pointer;" onclick="window.location.href='blog-detail.html?id=${post.id}'">
                    <div class="article-meta">${Utils.formatDate(post.createdAt)}</div>
                    <h2><a href="blog-detail.html?id=${post.id}" style="text-decoration: none;">${post.title}</a></h2>
                    <p>${post.excerpt}</p>
                    <div class="article-tags">
                        ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </article>
            `).join('');
        }

        function loadFriendLinks() {
            const container = document.getElementById('friendLinksContainer');
            const settings = Storage.getSettings();
            
            if (!settings.friendLinks || settings.friendLinks.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = settings.friendLinks.map(link => 
                `<a href="${link.url}" target="_blank">${link.name}</a>`
            ).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 记录页面访问
            Storage.recordPageView();
            
            initLanguage();
            loadArticles();
            loadFriendLinks();
        });
    </script>
</body>
</html>
