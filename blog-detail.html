<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Image Compressor</title>
    <meta name="description" content="Read articles about image compression, website optimization, and web development.">
    <meta name="keywords" content="blog, article, image compression, web development">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e5e5e5;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
        }

        .lang-switcher {
            display: flex;
            gap: 4px;
            background: var(--bg-primary);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .lang-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            color: var(--text-primary);
        }

        .lang-btn.active {
            background: var(--accent);
            color: white;
        }

        main {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 64px 24px;
            width: 100%;
        }

        .article-header {
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 24px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .article-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.3;
            margin-bottom: 16px;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .article-category {
            display: inline-block;
            padding: 4px 12px;
            background: #f0f4ff;
            color: var(--accent);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .tag {
            font-size: 12px;
            padding: 4px 10px;
            background: #f5f5f5;
            color: var(--text-secondary);
            border-radius: 4px;
        }

        .article-content {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .article-content p {
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .article-content h3 {
            font-size: 22px;
            font-weight: 600;
            margin: 36px 0 16px 0;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .article-content h4 {
            font-size: 18px;
            font-weight: 600;
            margin: 28px 0 12px 0;
            color: var(--text-primary);
        }

        .article-content ul,
        .article-content ol {
            margin: 16px 0;
            padding-left: 28px;
        }

        .article-content li {
            margin: 8px 0;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .article-content strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .article-content code {
            background: #f5f7fa;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            color: #e11d48;
        }

        .article-content pre {
            background: #1a1a2e;
            color: #eaeaea;
            padding: 20px 24px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 24px 0;
        }

        .article-content pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: 14px;
        }

        .article-content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            margin: 24px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .article-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }

        .article-content a {
            color: var(--accent);
            text-decoration: underline;
        }

        .article-content a:hover {
            text-decoration: none;
        }

        .not-found {
            text-align: center;
            padding: 80px 24px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .not-found h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            margin-bottom: 16px;
        }

        .not-found p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 48px 24px;
            margin-top: auto;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .friend-links {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .friend-links a {
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .friend-links a:hover {
            color: var(--accent);
        }

        .copyright {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .nav-inner {
                flex-direction: column;
                height: auto;
                padding: 12px 24px;
                gap: 12px;
            }

            .nav-left {
                width: 100%;
                justify-content: space-between;
            }

            .nav-links {
                gap: 20px;
            }

            .article-title {
                font-size: 28px;
            }

            .article-content {
                padding: 24px;
            }
        }
    </style>
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <div class="nav-left">
                <a href="index.html" class="logo">Image<span>Compressor</span></a>
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="nav.home">Home</a></li>
                    <li><a href="blog.html" class="active" data-i18n="nav.blog">Blog</a></li>
                    <li><a href="help.html" data-i18n="nav.help">Help</a></li>
                </ul>
            </div>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="zh">中文</button>
            </div>
        </div>
    </nav>

    <main id="articlePage">
    </main>

    <footer>
        <div class="footer-inner">
            <div class="footer-title" data-i18n="footer.friendLinks">Friend Links</div>
            <div class="friend-links" id="friendLinksContainer">
            </div>
            <div class="copyright" data-i18n="footer.copyright">© 2024 Image Compressor. Free online image compressor.</div>
        </div>
    </footer>

    <script>
        const langBtns = document.querySelectorAll('.lang-btn');
        let currentPost = null;

        function initLanguage() {
            const savedLang = localStorage.getItem('language') || 'en';
            setLanguage(savedLang);
            updateLangButtons(savedLang);
            translatePage();
        }

        function setLanguage(lang) {
            localStorage.setItem('language', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            
            const logo = document.querySelector('.logo');
            if (lang === 'zh') {
                logo.innerHTML = '图<span>压缩</span>';
                if (currentPost) {
                    document.title = `${currentPost.title} - 图压缩`;
                } else {
                    document.title = '文章 - 图压缩';
                }
            } else {
                logo.innerHTML = 'Image<span>Compressor</span>';
                if (currentPost) {
                    document.title = `${currentPost.title} - Image Compressor`;
                } else {
                    document.title = 'Article - Image Compressor';
                }
            }
            
            updateLangButtons(lang);
            translatePage();
        }

        function updateLangButtons(lang) {
            langBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setLanguage(btn.dataset.lang);
            });
        });

        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function loadArticle() {
            const container = document.getElementById('articlePage');
            const postId = getUrlParameter('id');
            const lang = getLanguage();
            
            if (!postId) {
                showNotFound(container, lang);
                return;
            }

            const post = Storage.getPosts().find(p => p.id === postId);
            
            if (!post || post.status !== 'published') {
                showNotFound(container, lang);
                return;
            }

            currentPost = post;
            
            if (lang === 'zh') {
                document.title = `${post.title} - 图压缩`;
            } else {
                document.title = `${post.title} - Image Compressor`;
            }

            const backText = lang === 'zh' ? '← 返回博客' : '← Back to Blog';
            const readTime = lang === 'zh' ? '约 5 分钟阅读' : '~5 min read';

            container.innerHTML = `
                <div class="article-header">
                    <a href="blog.html" class="back-link">${backText}</a>
                    <h1 class="article-title">${post.title}</h1>
                    <div class="article-meta">
                        <span class="article-category">${Utils.getCategoryName(post.category)}</span>
                        <span>${Utils.formatDate(post.createdAt)}</span>
                        <span>${readTime}</span>
                    </div>
                    <div class="article-tags">
                        ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
                <div class="article-content">
                    ${post.content}
                </div>
            `;
        }

        function showNotFound(container, lang) {
            const title = lang === 'zh' ? '文章不存在' : 'Article not found';
            const desc = lang === 'zh' ? '抱歉，您查找的文章不存在或已被删除。' : 'Sorry, the article you are looking for does not exist or has been removed.';
            const backBtn = lang === 'zh' ? '返回博客' : 'Back to Blog';

            container.innerHTML = `
                <div class="not-found">
                    <h2>${title}</h2>
                    <p>${desc}</p>
                    <a href="blog.html" class="btn-primary" style="padding: 10px 24px; background: #2563eb; color: white; border-radius: 8px; text-decoration: none; display: inline-block;">${backBtn}</a>
                </div>
            `;
        }

        function loadFriendLinks() {
            const container = document.getElementById('friendLinksContainer');
            const settings = Storage.getSettings();
            
            if (!settings.friendLinks || settings.friendLinks.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = settings.friendLinks.map(link => 
                `<a href="${link.url}" target="_blank">${link.name}</a>`
            ).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 记录页面访问
            Storage.recordPageView();
            
            initLanguage();
            loadArticle();
            loadFriendLinks();
        });
    </script>
</body>
</html>
