<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor - Free Online Image Compressor Tool</title>
    <meta name="description" content="Free online image compressor - compress JPG, PNG, WebP images without losing quality. Fast, secure, and privacy-friendly local processing.">
    <meta name="keywords" content="image compressor, online image compressor, image compressor online, online image compressor tool, jpg image compressor, tinypng image compressor, free image compressor">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="blog.html">
    <meta property="og:title" content="Image Compressor - Free Online Image Compressor Tool">
    <meta property="og:description" content="Free online image compressor - compress JPG, PNG, WebP images without losing quality. Fast, secure, and privacy-friendly local processing.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Image Compressor - Free Online Image Compressor Tool">
    <meta name="twitter:description" content="Free online image compressor - compress JPG, PNG, WebP images without losing quality.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e5e5e5;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav {
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-primary);
        }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 24px; list-style: none; }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--accent); }
        .language-switch { display: flex; gap: 8px; }
        .lang-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .lang-btn:hover { border-color: var(--accent); }
        .lang-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        main {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 48px 24px;
        }
        .page-header { margin-bottom: 48px; }
        .page-header h1 {
            font-size: 36px;
            margin-bottom: 12px;
            font-family: 'Space Grotesk', sans-serif;
        }
        .page-header p { color: var(--text-secondary); }
        .article-list { display: flex; flex-direction: column; gap: 24px; }
        .article-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .article-card a { text-decoration: none; color: inherit; }
        .article-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
        }
        .article-card .meta {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .article-card .excerpt {
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .article-card .tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag {
            padding: 4px 12px;
            background: #f1f5f9;
            color: #475569;
            border-radius: 4px;
            font-size: 12px;
        }
        .tag:hover { background: #e2e8f0; }
        .loading { text-align: center; padding: 48px; color: var(--text-muted); }
        footer {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <div>
                <a href="index.html" class="logo" id="logoText">Image<span>Compressor</span></a>
                <ul class="nav-links">
                    <li><a href="index.html" id="navHome">Home</a></li>
                    <li><a href="blog.html" id="navBlog">Blog</a></li>
                    <li><a href="help.html" id="navHelp">Help</a></li>
                </ul>
            </div>
            <div class="language-switch">
                <button class="lang-btn" id="langEn" onclick="setLanguage('en')">EN</button>
                <button class="lang-btn" id="langZh" onclick="setLanguage('zh')">中文</button>
            </div>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h1 id="pageTitle">Blog</h1>
            <p id="pageDesc">Share knowledge about image compression, website optimization, and frontend development</p>
        </div>

        <div class="article-list" id="articleList">
            <div class="loading" id="loading">Loading articles...</div>
        </div>
    </main>

    <footer>
        <p id="copyright">© 2024 Image Compressor. Free online image compressor.</p>
    </footer>

    <script>
        const translations = {
            en: {
                logo: 'Image<span>Compressor</span>',
                navHome: 'Home',
                navBlog: 'Blog',
                navHelp: 'Help',
                pageTitle: 'Blog',
                pageDesc: 'Share knowledge about image compression, website optimization, and frontend development',
                loading: 'Loading articles...',
                readMore: 'Read More',
                copyright: '© 2024 Image Compressor. Free online image compressor.',
                category: 'Category:',
                date: 'Date:'
            },
            zh: {
                logo: '图<span>压缩</span>',
                navHome: '首页',
                navBlog: '博客',
                navHelp: '帮助',
                pageTitle: '博客',
                pageDesc: '分享图片压缩、网站优化和前端开发的知识',
                loading: '加载文章中...',
                readMore: '阅读更多',
                copyright: '© 2024 图片压缩工具. 免费在线图片压缩工具.',
                category: '分类:',
                date: '日期:'
            }
        };

        function getBrowserLanguage() {
            const lang = navigator.language || navigator.userLanguage;
            return lang.startsWith('zh') ? 'zh' : 'en';
        }

        function getStoredLanguage() {
            const stored = localStorage.getItem('language');
            if (stored) return stored;
            const detected = getBrowserLanguage();
            localStorage.setItem('language', detected);
            return detected;
        }

        let currentLang = getStoredLanguage();

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('language', lang);
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('logoText').innerHTML = t.logo;
            document.getElementById('navHome').textContent = t.navHome;
            document.getElementById('navBlog').textContent = t.navBlog;
            document.getElementById('navHelp').textContent = t.navHelp;
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('pageDesc').textContent = t.pageDesc;
            document.getElementById('loading').textContent = t.loading;
            document.getElementById('copyright').textContent = t.copyright;
            document.getElementById('langEn').classList.toggle('active', currentLang === 'en');
            document.getElementById('langZh').classList.toggle('active', currentLang === 'zh');
            document.documentElement.lang = currentLang;
        }

        function loadArticles() {
            const articles = getPosts(true);
            const container = document.getElementById('articleList');
            const t = translations[currentLang];
            
            if (!articles || articles.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 48px;">${currentLang === 'zh' ? '暂无文章' : 'No articles yet'}</p>`;
                return;
            }

            articles.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
            
            container.innerHTML = articles.map(post => {
                const title = currentLang === 'zh' ? post.titleZh : post.title;
                const excerpt = currentLang === 'zh' ? post.excerptZh : post.excerpt;
                const tags = currentLang === 'zh' ? (post.tagsZh || post.tags || []) : (post.tags || []);
                const date = post.createdAt ? new Date(post.createdAt).toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US') : '';
                
                return `
                    <article class="article-card">
                        <a href="blog-detail.html?id=${post.id}">
                            <h2>${title}</h2>
                            <div class="meta">
                                <span>${t.category} ${post.category || 'uncategorized'}</span>
                                <span>${t.date} ${date}</span>
                            </div>
                            <p class="excerpt">${excerpt || ''}</p>
                            <div class="tags">
                                ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>
                        </a>
                    </article>
                `;
            }).join('');
        }

        function getPosts(publishedOnly = false) {
            try {
                const data = localStorage.getItem('imageCompressorData');
                if (!data) return [];
                const parsed = JSON.parse(data);
                let posts = parsed.posts || [];
                if (publishedOnly) {
                    posts = posts.filter(p => p.status === 'published');
                }
                return posts;
            } catch {
                return [];
            }
        }

        updateUI();
        loadArticles();
    </script>
</body>
</html>
