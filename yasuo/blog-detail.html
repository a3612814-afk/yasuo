<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor - Free Online Image Compressor Tool</title>
    <meta name="description" content="Free online image compressor - compress JPG, PNG, WebP images without losing quality. Fast, secure, and privacy-friendly local processing.">
    <meta name="keywords" content="image compressor, online image compressor, image compressor online, online image compressor tool, jpg image compressor, tinypng image compressor, free image compressor">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="blog-detail.html">
    <meta property="og:title" content="Image Compressor - Free Online Image Compressor Tool">
    <meta property="og:description" content="Free online image compressor - compress JPG, PNG, WebP images without losing quality. Fast, secure, and privacy-friendly local processing.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Image Compressor - Free Online Image Compressor Tool">
    <meta name="twitter:description" content="Free online image compressor - compress JPG, PNG, WebP images without losing quality.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e5e5e5;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav {
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-primary);
        }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 24px; list-style: none; }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--accent); }
        .language-switch { display: flex; gap: 8px; }
        .lang-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .lang-btn:hover { border-color: var(--accent); }
        .lang-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        main {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 48px 24px;
        }
        .article {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
        }
        .article-header { margin-bottom: 32px; }
        .article-title {
            font-size: 32px;
            margin-bottom: 16px;
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.3;
        }
        .article-meta {
            display: flex;
            gap: 20px;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .article-content {
            color: var(--text-secondary);
        }
        .article-content h2 {
            font-size: 24px;
            margin: 24px 0 12px;
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
        }
        .article-content h3 {
            font-size: 20px;
            margin: 20px 0 10px;
            color: var(--text-primary);
        }
        .article-content p { margin-bottom: 16px; }
        .article-content ul, .article-content ol {
            margin: 16px 0;
            padding-left: 24px;
        }
        .article-content li { margin-bottom: 8px; }
        .article-content code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .article-content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 16px;
            margin: 16px 0;
            color: var(--text-muted);
            font-style: italic;
        }
        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .tag {
            padding: 6px 14px;
            background: #f1f5f9;
            color: #475569;
            border-radius: 4px;
            font-size: 13px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 24px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent-hover); }
        .not-found {
            text-align: center;
            padding: 64px 24px;
        }
        .not-found h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }
        .not-found p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        footer {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <div>
                <a href="index.html" class="logo" id="logoText">Image<span>Compressor</span></a>
                <ul class="nav-links">
                    <li><a href="index.html" id="navHome">Home</a></li>
                    <li><a href="blog.html" id="navBlog">Blog</a></li>
                    <li><a href="help.html" id="navHelp">Help</a></li>
                </ul>
            </div>
            <div class="language-switch">
                <button class="lang-btn" id="langEn" onclick="setLanguage('en')">EN</button>
                <button class="lang-btn" id="langZh" onclick="setLanguage('zh')">中文</button>
            </div>
        </div>
    </nav>

    <main>
        <a href="blog.html" class="back-link" id="backLink">← Back to Blog</a>
        
        <article class="article" id="article">
            <div class="article-header">
                <h1 class="article-title" id="articleTitle">Loading...</h1>
                <div class="article-meta">
                    <span id="articleCategory">Category: Loading...</span>
                    <span id="articleDate">Date: Loading...</span>
                </div>
            </div>
            <div class="article-content" id="articleContent">Loading content...</div>
            <div class="article-tags" id="articleTags"></div>
        </article>
    </main>

    <footer>
        <p id="copyright">© 2024 Image Compressor. Free online image compressor.</p>
    </footer>

    <script>
        const translations = {
            en: {
                logo: 'Image<span>Compressor</span>',
                navHome: 'Home',
                navBlog: 'Blog',
                navHelp: 'Help',
                backLink: '← Back to Blog',
                category: 'Category:',
                date: 'Date:',
                notFound: 'Article Not Found',
                notFoundDesc: 'The article you are looking for does not exist.',
                goBack: 'Go Back to Blog',
                copyright: '© 2024 Image Compressor. Free online image compressor.'
            },
            zh: {
                logo: '图<span>压缩</span>',
                navHome: '首页',
                navBlog: '博客',
                navHelp: '帮助',
                backLink: '← 返回博客',
                category: '分类:',
                date: '日期:',
                notFound: '文章未找到',
                notFoundDesc: '您查找的文章不存在。',
                goBack: '返回博客',
                copyright: '© 2024 图片压缩工具. 免费在线图片压缩工具.'
            }
        };

        function getBrowserLanguage() {
            const lang = navigator.language || navigator.userLanguage;
            return lang.startsWith('zh') ? 'zh' : 'en';
        }

        function getStoredLanguage() {
            const stored = localStorage.getItem('language');
            if (stored) return stored;
            const detected = getBrowserLanguage();
            localStorage.setItem('language', detected);
            return detected;
        }

        let currentLang = getStoredLanguage();

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('language', lang);
            updateUI();
            loadArticle();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('logoText').innerHTML = t.logo;
            document.getElementById('navHome').textContent = t.navHome;
            document.getElementById('navBlog').textContent = t.navBlog;
            document.getElementById('navHelp').textContent = t.navHelp;
            document.getElementById('backLink').textContent = t.backLink;
            document.getElementById('copyright').textContent = t.copyright;
            document.getElementById('langEn').classList.toggle('active', currentLang === 'en');
            document.getElementById('langZh').classList.toggle('active', currentLang === 'zh');
            document.documentElement.lang = currentLang;
        }

        function getPostById(id) {
            try {
                const data = localStorage.getItem('imageCompressorData');
                if (!data) return null;
                const parsed = JSON.parse(data);
                const posts = parsed.posts || [];
                return posts.find(p => p.id === id);
            } catch {
                return null;
            }
        }

        function loadArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            
            if (!postId) {
                showNotFound();
                return;
            }

            const post = getPostById(postId);
            
            if (!post || post.status !== 'published') {
                showNotFound();
                return;
            }

            const t = translations[currentLang];
            const title = currentLang === 'zh' ? post.titleZh : post.title;
            const content = currentLang === 'zh' ? post.contentZh : post.content;
            const tags = currentLang === 'zh' ? (post.tagsZh || post.tags || []) : (post.tags || []);
            const date = post.createdAt ? new Date(post.createdAt).toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US') : '';
            
            document.getElementById('articleTitle').textContent = title || 'Untitled';
            document.getElementById('articleCategory').textContent = `${t.category} ${post.category || 'Uncategorized'}`;
            document.getElementById('articleDate').textContent = `${t.date} ${date}`;
            document.getElementById('articleContent').innerHTML = formatContent(content || '');
            document.getElementById('articleTags').innerHTML = tags.map(tag => `<span class="tag">${tag}</span>`).join('');
        }

        function formatContent(content) {
            return content
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>')
                .replace(/^/, '<p>')
                .replace(/$/, '</p>');
        }

        function showNotFound() {
            const t = translations[currentLang];
            document.getElementById('article').innerHTML = `
                <div class="not-found">
                    <h2>${t.notFound}</h2>
                    <p>${t.notFoundDesc}</p>
                    <a href="blog.html" class="btn" style="display:inline-block; padding:12px 24px; background: var(--accent); color: white; border-radius: 8px; text-decoration: none;">${t.goBack}</a>
                </div>
            `;
        }

        updateUI();
        loadArticle();
    </script>
</body>
</html>
