<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin login for image compression tool">
    <meta name="keywords" content="admin, login, image compression">
    <title data-i18n="admin.login.title">Admin Login - Image Compressor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e8ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 48px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 12px 24px rgba(0,0,0,0.08);
        }

        .lang-switcher {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            padding: 8px 16px;
            border: 1px solid #e5e5e5;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .lang-btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #999;
            text-decoration: none;
        }

        .back-link:hover {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn" id="lang-en" onclick="switchLanguage('en')">EN</button>
        <button class="lang-btn" id="lang-zh" onclick="switchLanguage('zh')">中文</button>
    </div>
    <div class="login-box">
        <div class="logo">图<span>压缩</span> Admin</div>
        <div class="subtitle" data-i18n="admin.login.prompt">Please login to continue</div>

        <form id="loginForm">
            <div class="form-group">
                <label data-i18n="admin.login.username">Username</label>
                <input type="text" name="username" id="username" placeholder="" required>
            </div>
            <div class="form-group">
                <label data-i18n="admin.login.password">Password</label>
                <input type="password" name="password" id="password" placeholder="" required>
            </div>
            <button type="submit" class="btn" data-i18n="admin.login.submit">Login</button>
        </form>

        <a href="../index.html" class="back-link" data-i18n="admin.login.backToHome">Back to Home</a>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/i18n.js"></script>
    <script>
        function switchLanguage(lang) {
            setLanguage(lang);
            translatePage();
            updateLangButtons();
            updatePlaceholders();
        }

        function updateLangButtons() {
            const currentLang = getLanguage();
            document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
            document.getElementById('lang-zh').classList.toggle('active', currentLang === 'zh');
            document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
        }

        function updatePlaceholders() {
            const lang = getLanguage();
            document.getElementById('username').placeholder = lang === 'zh' ? '请输入用户名' : 'Enter username';
            document.getElementById('password').placeholder = lang === 'zh' ? '请输入密码' : 'Enter password';
        }

        if (Storage.isLoggedIn()) {
            window.location.href = 'dashboard.html';
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const username = formData.get('username');
            const password = formData.get('password');
            
            if (Storage.login(username, password)) {
                window.location.href = 'dashboard.html';
            } else {
                const lang = getLanguage();
                alert(lang === 'zh' ? '用户名或密码错误！默认账号：admin / admin123' : 'Invalid username or password! Default: admin / admin123');
            }
        });

        initLanguage();
        updateLangButtons();
        updatePlaceholders();
    </script>
</body>
</html>
