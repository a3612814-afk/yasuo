<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Center - Image Compressor</title>
    <meta name="description" content="Frequently asked questions and user guide for Image Compressor.">
    <meta name="keywords" content="help, FAQ, user guide, image compression">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e5e5e5;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
        }

        .lang-switcher {
            display: flex;
            gap: 4px;
            background: var(--bg-primary);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .lang-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            color: var(--text-primary);
        }

        .lang-btn.active {
            background: var(--accent);
            color: white;
        }

        main {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 64px 24px;
            width: 100%;
        }

        .page-header {
            margin-bottom: 48px;
        }

        .page-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
        }

        .faq-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .faq-item {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .faq-item h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .faq-item p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 48px 24px;
            margin-top: auto;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .friend-links {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .friend-links a {
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .friend-links a:hover {
            color: var(--accent);
        }

        .copyright {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .nav-inner {
                flex-direction: column;
                height: auto;
                padding: 12px 24px;
                gap: 12px;
            }

            .nav-left {
                width: 100%;
                justify-content: space-between;
            }

            .nav-links {
                gap: 20px;
            }

            .page-header h1 {
                font-size: 28px;
            }
        }
    </style>
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <div class="nav-left">
                <a href="index.html" class="logo">Image<span>Compressor</span></a>
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="nav.home">Home</a></li>
                    <li><a href="blog.html" data-i18n="nav.blog">Blog</a></li>
                    <li><a href="help.html" class="active" data-i18n="nav.help">Help</a></li>
                </ul>
            </div>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="zh">中文</button>
            </div>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h1 data-i18n="help.title">Help Center</h1>
            <p data-i18n="help.subtitle">Frequently Asked Questions & User Guide</p>
        </div>

        <div class="faq-list" id="faqContainer">
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <div class="footer-title" data-i18n="footer.friendLinks">Friend Links</div>
            <div class="friend-links" id="friendLinksContainer">
            </div>
            <div class="copyright" data-i18n="footer.copyright">© 2024 Image Compressor. Free online image compressor.</div>
        </div>
    </footer>

    <script>
        const langBtns = document.querySelectorAll('.lang-btn');

        const faqData = {
            en: [
                {
                    q: "What image formats does Image Compressor support?",
                    a: "Currently supports JPG, JPEG, PNG, and WebP formats. More formats will be supported in future versions."
                },
                {
                    q: "Will the image quality degrade after compression?",
                    a: "We try to compress image size while maintaining acceptable quality. You can manually adjust the compression ratio if you need higher quality."
                },
                {
                    q: "Is my image safe? Will it be uploaded to the server?",
                    a: "Completely safe. All image compression operations are done locally in your browser, and images are never uploaded to any server."
                },
                {
                    q: "Can the compressed images be used commercially?",
                    a: "Of course. The copyright of the compressed images still belongs to you and can be used for any commercial or non-commercial purposes."
                },
                {
                    q: "Is there an image size limit?",
                    a: "It is recommended that a single image not exceed 10MB. Images that are too large may cause the browser to slow down."
                },
                {
                    q: "How to get the best compression effect?",
                    a: "It is recommended to resize the image to the actual use size before compression, which can achieve smaller file size and better display effect."
                }
            ],
            zh: [
                {
                    q: "图压缩支持哪些图片格式？",
                    a: "目前支持 JPG、JPEG、PNG、WebP 等主流图片格式。未来版本将支持更多格式。"
                },
                {
                    q: "图片压缩后画质会变差吗？",
                    a: "我们会尽量在保持可接受画质的前提下压缩图片体积。如需更高画质，可以手动调整压缩比例。"
                },
                {
                    q: "我的图片安全吗？会不会被上传到服务器？",
                    a: "完全安全。所有图片压缩操作均在您的浏览器本地完成，图片不会上传到任何服务器。"
                },
                {
                    q: "压缩后的图片可以商用吗？",
                    a: "当然可以。压缩后的图片版权仍归您所有，可用于任何商业或非商业用途。"
                },
                {
                    q: "有图片大小限制吗？",
                    a: "单张图片建议不超过 10MB。过大的图片可能会导致浏览器处理变慢。"
                },
                {
                    q: "如何获得最佳的压缩效果？",
                    a: "建议将图片尺寸调整为实际使用尺寸后再压缩，这样可以获得更小的文件体积和更好的显示效果。"
                }
            ]
        };

        function initLanguage() {
            const savedLang = localStorage.getItem('language') || 'en';
            setLanguage(savedLang);
            updateLangButtons(savedLang);
            translatePage();
            loadFAQ(savedLang);
        }

        function setLanguage(lang) {
            localStorage.setItem('language', lang);
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            
            const logo = document.querySelector('.logo');
            if (lang === 'zh') {
                logo.innerHTML = '图<span>压缩</span>';
                document.title = '帮助中心 - 图压缩';
            } else {
                logo.innerHTML = 'Image<span>Compressor</span>';
                document.title = 'Help Center - Image Compressor';
            }
            
            updateLangButtons(lang);
            translatePage();
            loadFAQ(lang);
        }

        function updateLangButtons(lang) {
            langBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        function loadFAQ(lang) {
            const container = document.getElementById('faqContainer');
            const faqs = faqData[lang] || faqData.en;
            
            container.innerHTML = faqs.map(faq => `
                <div class="faq-item">
                    <h3>${faq.q}</h3>
                    <p>${faq.a}</p>
                </div>
            `).join('');
        }

        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setLanguage(btn.dataset.lang);
            });
        });

        function loadFriendLinks() {
            const container = document.getElementById('friendLinksContainer');
            const settings = Storage.getSettings();
            
            if (!settings.friendLinks || settings.friendLinks.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = settings.friendLinks.map(link => 
                `<a href="${link.url}" target="_blank">${link.name}</a>`
            ).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLanguage();
            loadFriendLinks();
        });
    </script>
</body>
</html>
